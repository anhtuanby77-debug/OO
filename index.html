<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JESTER MODZ</title>
<style>
:root{
  --bg1:#050b1a; --bg2:#0b2a52; --cyan:#27d3ff; --text:#f2f8ff; --muted:#8aa3c2;
  --card:rgba(10,14,24,.72); --off:#2a2d35; --knob:#8b8f98;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:"Be Vietnam Pro","Segoe UI",Roboto,system-ui,sans-serif;
  background:
    radial-gradient(60% 40% at 50% 0%,rgba(39,211,255,.35),transparent 70%),
    radial-gradient(50% 35% at 85% 60%,rgba(70,110,255,.28),transparent 70%),
    linear-gradient(180deg,var(--bg2),var(--bg1));
  background-attachment:fixed;
}
.wrap{max-width:460px;margin:0 auto;padding:28px 16px 40px;display:flex;flex-direction:column;align-items:center}

/* ===== CSS ĐÃ ĐƯỢC SỬA CHO ẢNH CATBOX ===== */
.avatar{
  width:112px;height:112px;border-radius:50%;
  border:3px solid var(--cyan);
  /* Thay link Catbox của mày vào đây */
  background: url('https://files.catbox.moe/qe7kv2.webp') center/cover no-repeat;
  box-shadow:0 0 28px rgba(39,211,255,.7),inset 0 0 20px rgba(0,0,0,.5);
  display:grid;place-items:center;font-size:52px;
  animation:glow 3s ease-in-out infinite;
}
@keyframes glow{50%{box-shadow:0 0 46px rgba(39,211,255,.95),inset 0 0 20px rgba(0,0,0,.5)}}
/* ========================================= */

h1{margin:20px 0 4px;font-size:30px;font-weight:800;letter-spacing:.3px;text-align:center}
.sub{color:var(--muted);font-size:14px;margin-bottom:18px;text-align:center}
.eyes{display:flex;gap:26px;margin-bottom:22px}
.eye{width:62px;height:62px;border-radius:50%;border:3px solid var(--cyan);
  background:radial-gradient(circle,#0b1c3d 40%,#123a78);box-shadow:0 0 16px rgba(39,211,255,.6);
  display:flex;align-items:center;justify-content:center;gap:6px}
.eye i{width:8px;height:8px;border-radius:50%;background:#fff}
.list{width:100%;display:flex;flex-direction:column;gap:14px}
.row{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 20px;border-radius:24px;cursor:pointer;
  background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.07);
  transition:border-color .25s,box-shadow .25s;
  font-size:19px;font-weight:500;user-select:none;
}
.row.on{border-color:rgba(39,211,255,.7);box-shadow:0 0 20px rgba(39,211,255,.25)}
.sw{position:relative;width:78px;height:40px;border-radius:20px;background:var(--off);transition:background .25s;flex:none}
.sw b{
  position:absolute;top:3px;left:3px;width:34px;height:34px;border-radius:50%;
  background:var(--knob);display:grid;place-items:center;
  font-size:10px;font-weight:700;color:#e6e8ee;transition:transform .25s,background .25s;
}
.sw b::after{content:"OFF"}
.row.on .sw{background:rgba(39,211,255,.3)}
.row.on .sw b{transform:translateX(38px);background:var(--cyan);color:#022}
.row.on .sw b::after{content:"ON"}
.row:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.foot{margin-top:22px;color:var(--muted);font-size:12px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:12px 20px;border-radius:999px;background:rgba(8,16,32,.92);border:1px solid var(--cyan);color:var(--text);font-size:14px;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <!-- Thẻ div avatar giờ sẽ hiển thị ảnh nền thay vì emoji -->
  <div class="avatar" aria-hidden="true"></div>
  
  <h1>JESTER MODZ</h1>
  <div class="sub"></div>
  <div class="eyes" aria-hidden="true"><div class="eye"><i></i><i></i></div><div class="eye"><i></i><i></i></div></div>

  <div class="list" id="list">
    <div class="row" tabindex="0" role="switch" aria-checked="false"><span>AIMLOCK</span><span class="sw"><b></b></span></div>
    <div class="row" tabindex="0" role="switch" aria-checked="false"><span>AIMLOCK HEAD</span><span class="sw"><b></b></span></div>
    <div class="row" tabindex="0" role="switch" aria-checked="false"><span>NHẸ TÂM + FIX LỐ</span><span class="sw"><b></b></span></div>
    <div class="row" tabindex="0" role="switch" aria-checked="false"><span>HIỆN MÁU ĐỊCH</span><span class="sw"><b></b></span></div>
    <div class="row" tabindex="0" role="switch" aria-checked="false"><span>TĂNG MƯỢT</span><span class="sw"><b></b></span></div>
  </div>
  <div class="foot"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
var KEY='jester-modz',saved={};
try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
var toast=document.getElementById('toast'),tt;
function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('show')},1400)}
document.querySelectorAll('.row').forEach(function(r){
  var name=r.firstElementChild.textContent;
  function set(on){r.classList.toggle('on',on);r.setAttribute('aria-checked',on)}
  set(!!saved[name]);
  function toggle(){
    var on=!r.classList.contains('on');
    set(on);saved[name]=on;
    try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}
    if(navigator.vibrate){try{navigator.vibrate(15)}catch(e){}}
    say(name+': '+(on?'đã bật':'đã tắt'));
  }
  r.addEventListener('click',toggle);
  r.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle()}});
});
</script>
</body>
</html>
